[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false  # set true if the compiler reports "stack too deep"
# Robinhood Chain is an Arbitrum Orbit (Nitro) chain.
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Fork tests need ROBINHOOD_RPC_URL; run them explicitly.
no_match_path = "test/fork/*"

[profile.default.fuzz]
runs = 1000

[profile.fork]
no_match_path = ""
match_path = "test/fork/*"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[fmt]
line_length = 120
